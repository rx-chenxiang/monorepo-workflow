# Repositories are grouped by workspace section.
#
# 当前文件说明：
# 本文件用于配置通用四端项目的远程仓库拉取信息。模板默认不预置真实业务仓库地址；
# 接入项目时，把下面示例中的 Git 地址、分支、target_dir、project_id 替换为实际值。
#
# Format:
# [workspace_name]
# [transport]git_url|branch(optional)|target_dir(optional)|project_id(optional)
#
# Defaults:
# - pull_repos.sh uses transport=https unless --transport ssh or --all-transports is set.
# - target_dir is written explicitly so startup scripts can reuse it.
# - project_id defaults to the repository name and is used by --project.
#
# Example:
# [general]
# [https]https://github.com/your-org/api.git|main|api|api
# [https]https://github.com/your-org/fornt_admin.git|main|fornt_admin|fornt_admin
# [https]https://github.com/your-org/m_front.git|main|m_front|m_front
# [https]https://github.com/your-org/pc_fornt.git|main|pc_fornt|pc_fornt

[general]
# [https]https://github.com/your-org/api.git|main|api|api
# [ssh]git@github.com:your-org/api.git|main|api|api
# [https]https://github.com/your-org/fornt_admin.git|main|fornt_admin|fornt_admin
# [ssh]git@github.com:your-org/fornt_admin.git|main|fornt_admin|fornt_admin
# [https]https://github.com/your-org/m_front.git|main|m_front|m_front
# [ssh]git@github.com:your-org/m_front.git|main|m_front|m_front
# [https]https://github.com/your-org/pc_fornt.git|main|pc_fornt|pc_fornt
# [ssh]git@github.com:your-org/pc_fornt.git|main|pc_fornt|pc_fornt

