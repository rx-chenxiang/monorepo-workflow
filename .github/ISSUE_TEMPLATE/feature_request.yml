name: 功能建议
description: 为工作区模板、文档、规则、Agent 或脚本提出改进建议。
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 说明当前协作流程中的具体痛点和受影响对象。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 描述希望加入或调整的行为、目录或文档。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      options:
        - 文档与模板
        - Agent / Rules / Skills
        - 多仓库管理脚本
        - 多端协作约定
        - 其他
    validations:
      required: true
